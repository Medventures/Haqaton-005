services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-hackathon}
      OPERATORS: ${OPERATORS:-}
      APP_ENV: ${APP_ENV:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      CATALOG_PATH: /app/catalog.json
      TRIAGE_PATH: /app/triage_rules.json
      KNOWLEDGE_PATH: /app/knowledge.json
      QUESTIONS_PATH: /app/questions.json
    volumes:
      - ./catalog.json:/app/catalog.json:ro
      - ./triage_rules.json:/app/triage_rules.json:ro
      - ./knowledge.json:/app/knowledge.json:ro
      - ./questions.json:/app/questions.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      db: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports: ["127.0.0.1:5180:80"]
    depends_on: [backend]

  # Optional fully-containerised LLM (llama.cpp server, OpenAI-compatible API).
  # Not started by plain `docker compose up`; enable with `docker compose --profile llm up -d`
  # and set LLM_BASE_URL=http://llm:8080/v1 in .env. The port is NOT published to the host:
  # only services on the compose network (backend) can reach it.
  # GPU (NVIDIA): use image ghcr.io/ggml-org/llama.cpp:server-cuda, add `-ngl 99` to the command
  # and uncomment the `deploy` block below (requires nvidia-container-toolkit).
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llm]
    command: >
      -m /models/${LLM_GGUF:-model.gguf}
      --host 0.0.0.0 --port 8080
      -c 8192 -np 1 --jinja --no-webui
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
