services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-hackathon}
      OPERATORS: ${OPERATORS:-}
      APP_ENV: ${APP_ENV:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CATALOG_PATH: /app/catalog.json
      TRIAGE_PATH: /app/triage_rules.json
    volumes:
      - ./catalog.json:/app/catalog.json:ro
      - ./triage_rules.json:/app/triage_rules.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      db: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports: ["127.0.0.1:5180:80"]
    depends_on: [backend]

volumes:
  pgdata:
