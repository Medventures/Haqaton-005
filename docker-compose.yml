services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 2s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      retries: 30

  # one-shot: pulls OLLAMA_MODEL into the shared volume, then exits
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama: {condition: service_healthy}

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic?sslmode=disable
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      JWT_SECRET: ${JWT_SECRET:-change-me-hackathon}
      CATALOG_PATH: /app/catalog.json
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      db: {condition: service_healthy}
      ollama-pull: {condition: service_completed_successfully}

volumes:
  pgdata:
  ollama:
